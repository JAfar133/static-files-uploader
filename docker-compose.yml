# Static Hub не занимает порты 80/443: TLS отдаёт уже работающий Caddy проекта expenses-tracker,
# а этот стек подключается к его docker-сети и принимает от него обычный HTTP.
services:
  hub-api:
    build: ./api
    restart: unless-stopped
    environment:
      STATIC_DIR: /sites/static
      STAGING_DIR: /sites/.staging
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
    volumes:
      - sites:/sites
    networks: [internal]

  hub:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    restart: unless-stopped
    depends_on: [hub-api]
    env_file: .env
    volumes:
      - sites:/sites:ro
    networks:
      internal:
      proxy:
        aliases: [statichub]

volumes:
  sites:

networks:
  internal:
  proxy:
    external: true
    name: expenses-tracker_default
