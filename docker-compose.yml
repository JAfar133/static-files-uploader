# Базовая часть Static Hub. Режим запуска выбирают наложения (см. README):
#   docker-compose.standalone.yml — сам занимает 80/443 и выпускает HTTPS;
#   docker-compose.edge.yml       — без портов, за общим Caddy (репозиторий vpnserver-infrastructure).
# Обычно выбор делают скрипты scripts/deploy-standalone.sh и scripts/deploy-edge.sh (они записывают COMPOSE_FILE в .env).
services:
  hub-api:
    build: ./api
    restart: unless-stopped
    environment:
      STATIC_DIR: /sites/static
      STAGING_DIR: /sites/.staging
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
    volumes:
      - sites:/sites
    networks: [internal]

  hub:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    restart: unless-stopped
    depends_on: [hub-api]
    env_file: .env
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - sites:/sites:ro
      - caddy_data:/data      # сертификаты (нужны в самостоятельном режиме)
      - caddy_config:/config
    networks: [internal]

volumes:
  sites:
  caddy_data:
  caddy_config:

networks:
  internal:
